name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -X utf8 -m unittest discover -s .codex/tests -p "test_project_auditor_*.py" -v
      - run: auditor --help
